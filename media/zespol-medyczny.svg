<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120">
  <!-- Tło z gradientem (jak na stronie) -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F7FB"/>
      <stop offset="100%" stop-color="#E8F1F8"/>
    </linearGradient>
    <linearGradient id="navy-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#357AC5"/>
      <stop offset="100%" stop-color="#1B2D54"/>
    </linearGradient>
  </defs>
  
  <!-- Tło zaokrąglone -->
  <rect width="320" height="120" rx="16" fill="url(#bg)"/>
  
  <!-- Dekoracyjne kółka w tle -->
  <circle cx="280" cy="20" r="40" fill="#83C293" opacity="0.08"/>
  <circle cx="30" cy="100" r="30" fill="#357AC5" opacity="0.08"/>
  
  <!-- ===== LEKARZ 1 (kobieta - pielęgniarka) ===== -->
  <g transform="translate(70, 30)">
    <!-- Włosy (tył) -->
    <ellipse cx="0" cy="-2" rx="18" ry="20" fill="#3D2817"/>
    <!-- Szyja -->
    <rect x="-5" y="12" width="10" height="8" fill="#F4C8A3"/>
    <!-- Twarz -->
    <circle cx="0" cy="0" r="15" fill="#F4C8A3"/>
    <!-- Włosy (przód - grzywka) -->
    <path d="M -15 -5 Q -10 -16 0 -15 Q 10 -16 15 -5 Q 12 -10 6 -10 Q 0 -12 -6 -10 Q -12 -10 -15 -5 Z" fill="#3D2817"/>
    <!-- Oczy -->
    <circle cx="-5" cy="0" r="1.5" fill="#1B2D54"/>
    <circle cx="5" cy="0" r="1.5" fill="#1B2D54"/>
    <!-- Usta (uśmiech) -->
    <path d="M -3 6 Q 0 9 3 6" stroke="#1B2D54" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Czepek pielęgniarski -->
    <path d="M -16 -10 L 16 -10 L 14 -18 L -14 -18 Z" fill="#FFFFFF" stroke="#357AC5" stroke-width="1"/>
    <!-- Krzyż na czepku -->
    <rect x="-2" y="-17" width="4" height="6" fill="#83C293"/>
    <rect x="-3" y="-15" width="6" height="2" fill="#83C293"/>
    <!-- Korpus (fartuch) -->
    <path d="M -22 20 Q -22 35 -22 55 L 22 55 Q 22 35 22 20 L 14 20 L 10 23 L -10 23 L -14 20 Z" fill="#FFFFFF" stroke="#357AC5" stroke-width="1"/>
    <!-- Kołnierzyk -->
    <path d="M -10 23 L 0 30 L 10 23" stroke="#357AC5" stroke-width="1.5" fill="none"/>
    <!-- Identyfikator -->
    <rect x="-12" y="35" width="10" height="6" rx="1" fill="#1B2D54"/>
    <rect x="-11" y="36" width="4" height="1" fill="#FFFFFF"/>
    <rect x="-11" y="38" width="6" height="1" fill="#FFFFFF"/>
    <!-- Stetoskop -->
    <path d="M -8 30 Q -15 38 -10 50 Q -5 52 -2 48" stroke="#357AC5" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="-2" cy="48" r="2.5" fill="#357AC5"/>
    <circle cx="-2" cy="48" r="1" fill="#1B2D54"/>
  </g>
  
  <!-- ===== LEKARZ 2 (mężczyzna - lekarz) ===== -->
  <g transform="translate(160, 32)">
    <!-- Szyja -->
    <rect x="-5" y="12" width="10" height="8" fill="#E0B080"/>
    <!-- Twarz -->
    <circle cx="0" cy="0" r="15" fill="#E0B080"/>
    <!-- Włosy -->
    <path d="M -15 -3 Q -15 -16 0 -16 Q 15 -16 15 -3 Q 13 -10 8 -10 Q 0 -12 -8 -10 Q -13 -10 -15 -3 Z" fill="#2C1810"/>
    <!-- Oczy -->
    <circle cx="-5" cy="0" r="1.5" fill="#1B2D54"/>
    <circle cx="5" cy="0" r="1.5" fill="#1B2D54"/>
    <!-- Okulary -->
    <circle cx="-5" cy="0" r="3.5" stroke="#1B2D54" stroke-width="1" fill="none"/>
    <circle cx="5" cy="0" r="3.5" stroke="#1B2D54" stroke-width="1" fill="none"/>
    <line x1="-1.5" y1="0" x2="1.5" y2="0" stroke="#1B2D54" stroke-width="1"/>
    <!-- Usta -->
    <path d="M -2 7 Q 0 9 2 7" stroke="#1B2D54" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Korpus (fartuch lekarski biały) -->
    <path d="M -22 20 Q -22 35 -22 55 L 22 55 Q 22 35 22 20 L 14 20 L 10 23 L -10 23 L -14 20 Z" fill="#FFFFFF" stroke="#1B2D54" stroke-width="1"/>
    <!-- Wycięcie na koszulę -->
    <path d="M -10 23 L -3 32 L 3 32 L 10 23" fill="#357AC5"/>
    <!-- Krawat -->
    <path d="M -2 32 L 0 45 L 2 32 Z" fill="#1B2D54"/>
    <!-- Kieszeń -->
    <rect x="6" y="35" width="10" height="8" stroke="#1B2D54" stroke-width="0.5" fill="none"/>
    <!-- Długopisy w kieszeni -->
    <line x1="8" y1="33" x2="8" y2="38" stroke="#1B2D54" stroke-width="1"/>
    <line x1="11" y1="33" x2="11" y2="38" stroke="#357AC5" stroke-width="1"/>
    <!-- Stetoskop wokół szyi -->
    <path d="M -10 22 Q -18 30 -16 42 Q -12 45 -8 42" stroke="#1B2D54" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 10 22 Q 18 30 16 42 Q 12 45 8 42" stroke="#1B2D54" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="-8" cy="42" r="2" fill="#1B2D54"/>
    <circle cx="8" cy="42" r="2" fill="#1B2D54"/>
  </g>
  
  <!-- ===== LEKARZ 3 (kobieta - lekarka) ===== -->
  <g transform="translate(250, 30)">
    <!-- Włosy (długie z boków) -->
    <path d="M -18 -3 Q -20 15 -18 25 L -14 22 L -14 0 Z" fill="#8B5A2B"/>
    <path d="M 18 -3 Q 20 15 18 25 L 14 22 L 14 0 Z" fill="#8B5A2B"/>
    <!-- Szyja -->
    <rect x="-5" y="12" width="10" height="8" fill="#F0B890"/>
    <!-- Twarz -->
    <circle cx="0" cy="0" r="15" fill="#F0B890"/>
    <!-- Włosy (góra) -->
    <path d="M -16 -8 Q -10 -18 0 -16 Q 10 -18 16 -8 Q 14 -12 6 -11 Q 0 -13 -6 -11 Q -14 -12 -16 -8 Z" fill="#8B5A2B"/>
    <!-- Oczy -->
    <circle cx="-5" cy="0" r="1.5" fill="#1B2D54"/>
    <circle cx="5" cy="0" r="1.5" fill="#1B2D54"/>
    <!-- Usta (uśmiech) -->
    <path d="M -3 6 Q 0 9 3 6" stroke="#1B2D54" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Kolczyki -->
    <circle cx="-14" cy="3" r="1" fill="#83C293"/>
    <circle cx="14" cy="3" r="1" fill="#83C293"/>
    <!-- Korpus (fartuch) -->
    <path d="M -22 20 Q -22 35 -22 55 L 22 55 Q 22 35 22 20 L 14 20 L 10 23 L -10 23 L -14 20 Z" fill="#FFFFFF" stroke="#83C293" stroke-width="1"/>
    <!-- Kołnierzyk V -->
    <path d="M -10 23 L 0 33 L 10 23" stroke="#83C293" stroke-width="1.5" fill="none"/>
    <!-- Identyfikator -->
    <rect x="2" y="35" width="10" height="6" rx="1" fill="#83C293"/>
    <rect x="3" y="36" width="4" height="1" fill="#FFFFFF"/>
    <rect x="3" y="38" width="6" height="1" fill="#FFFFFF"/>
    <!-- Stetoskop -->
    <path d="M 8 30 Q 15 38 10 50 Q 5 52 2 48" stroke="#83C293" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="2" cy="48" r="2.5" fill="#83C293"/>
    <circle cx="2" cy="48" r="1" fill="#FFFFFF"/>
  </g>
  
  <!-- Cień pod postaciami -->
  <ellipse cx="160" cy="115" rx="120" ry="3" fill="#1B2D54" opacity="0.1"/>
</svg>
