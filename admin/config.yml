          - {label: "Opieka opis", name: "opieka_opis", widget: "text", required: false}
          - label: "Opieka zakresy"
            name: "opieka_zakresy"
            widget: "list"
            field: {label: "Zakres", name: "nazwa", widget: "string"}
            required: false
- label: "Lekarze"
            name: "lekarze"
            widget: "list"
            fields:
              - {label: "Imię i nazwisko", name: "nazwisko", widget: "string"}
              - {label: "Specjalizacja", name: "specjalizacja", widget: "string", required: false}
              - {label: "Poradnia", name: "poradnia", widget: "string", required: false}
          - label: "Pielęgniarki"
            name: "pielegniarki"
            widget: "list"
            fields:
