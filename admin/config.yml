              - {label: "Specjalizacja", name: "specjalizacja", widget: "string", required: false}
          - label: "Telefony"
            name: "telefony"
            widget: "list"
            fields:
              - {label: "Dział", name: "dzial", widget: "string"}
              - {label: "Numer", name: "numer", widget: "string"}
          - label: "Dokumenty PDF"
            name: "dokumenty"
            widget: "list"
            fields:
              - {label: "Nazwa", name: "nazwa", widget: "string"}
              - {label: "Plik", name: "url", widget: "file", required: false}
          - label: "Certyfikaty"
            name: "certyfikaty"
            widget: "list"
            fields:
              - {label: "Nazwa", name: "nazwa", widget: "string"}
              - {label: "Plik", name: "url", widget: "file", required: false}
          - {label: "Opłaty treść", name: "oplaty_tresc", widget: "text", required: false}
          - {label: "RODO treść", name: "rodo_tresc", widget: "text", required: false}

