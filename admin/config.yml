backend:
  name: git-gateway
  repo: Kamilgz/grupa-zdrowie
  branch: main
  identity_url: https://auth.decapbridge.com/sites/7e7a16ea-6f78-474a-a3f0-0954d862a182
  gateway_url: https://gateway.decapbridge.com
  auth_type: ""
  auth_endpoint: oauth/external

site_url: https://kamilgz.github.io/grupa-zdrowie/
display_url: https://kamilgz.github.io/grupa-zdrowie/
logo_url: https://kamilgz.github.io/grupa-zdrowie/

publish_mode: simple
media_folder: "media"
public_folder: "/media"
locale: "pl"

collections:
  # ========== SEKCJA HERO (góra strony) ==========
  - name: "tresci"
    label: "🌐 Treści strony głównej"
    description: "Edytuj teksty na stronie głównej"
    files:
      - file: "tresci/hero.md"
        label: "1. Sekcja HERO (góra strony)"
        name: "hero"
        fields:
          - {label: "Mała etykieta (np. 'Platforma medyczna')", name: "tag", widget: "string"}
          - {label: "Tytuł - linia 1 (czarna część)", name: "tytul_linia_1", widget: "string"}
          - {label: "Tytuł - linia 2 (niebieska część)", name: "tytul_linia_2", widget: "string"}
          - {label: "Opis pod tytułem", name: "opis", widget: "text"}
          - {label: "Tekst przycisku 1 (granatowy)", name: "przycisk_1", widget: "string"}
          - {label: "Tekst przycisku 2 (niebieski)", name: "przycisk_2", widget: "string"}
          - {label: "Obrazek pod przyciskami", name: "obrazek", widget: "image", required: false}
      
      - file: "tresci/moduly.md"
        label: "2. Sekcja MODUŁY (3 kafelki)"
        name: "moduly"
        fields:
          - {label: "Etykieta sekcji", name: "etykieta", widget: "string"}
          - {label: "Tytuł sekcji", name: "tytul", widget: "string"}
          - {label: "Opis sekcji", name: "opis", widget: "text"}
          - {label: "Moduł 1 - tytuł", name: "modul_1_tytul", widget: "string"}
          - {label: "Moduł 1 - opis", name: "modul_1_opis", widget: "text"}
          - {label: "Moduł 2 - tytuł", name: "modul_2_tytul", widget: "string"}
          - {label: "Moduł 2 - opis", name: "modul_2_opis", widget: "text"}
          - {label: "Moduł 3 - tytuł", name: "modul_3_tytul", widget: "string"}
          - {label: "Moduł 3 - opis", name: "modul_3_opis", widget: "text"}
      
      - file: "tresci/konto.md"
        label: "3. Sekcja KONTO PACJENTA"
        name: "konto"
        fields:
          - {label: "Etykieta sekcji", name: "etykieta", widget: "string"}
          - {label: "Tytuł sekcji", name: "tytul", widget: "string"}
          - {label: "Opis sekcji", name: "opis", widget: "text"}
          - {label: "Funkcja 1 - tytuł", name: "f1_tytul", widget: "string"}
          - {label: "Funkcja 1 - opis", name: "f1_opis", widget: "text"}
          - {label: "Funkcja 2 - tytuł", name: "f2_tytul", widget: "string"}
          - {label: "Funkcja 2 - opis", name: "f2_opis", widget: "text"}
          - {label: "Funkcja 3 - tytuł", name: "f3_tytul", widget: "string"}
          - {label: "Funkcja 3 - opis", name: "f3_opis", widget: "text"}
          - {label: "Funkcja 4 - tytuł", name: "f4_tytul", widget: "string"}
          - {label: "Funkcja 4 - opis", name: "f4_opis", widget: "text"}
          - {label: "Funkcja 5 - tytuł", name: "f5_tytul", widget: "string"}
          - {label: "Funkcja 5 - opis", name: "f5_opis", widget: "text"}
          - {label: "Funkcja 6 - tytuł", name: "f6_tytul", widget: "string"}
          - {label: "Funkcja 6 - opis", name: "f6_opis", widget: "text"}
          - {label: "Funkcja 7 - tytuł", name: "f7_tytul", widget: "string"}
          - {label: "Funkcja 7 - opis", name: "f7_opis", widget: "text"}
          - {label: "Funkcja 8 - tytuł", name: "f8_tytul", widget: "string"}
          - {label: "Funkcja 8 - opis", name: "f8_opis", widget: "text"}
      
      - file: "tresci/wiedza.md"
        label: "4. Sekcja WIEDZA I WSPARCIE"
        name: "wiedza"
        fields:
          - {label: "Etykieta sekcji", name: "etykieta", widget: "string"}
          - {label: "Tytuł sekcji", name: "tytul", widget: "string"}
          - {label: "Opis sekcji", name: "opis", widget: "text"}
          - {label: "Karta 1 - tag", name: "k1_tag", widget: "string"}
          - {label: "Karta 1 - tytuł", name: "k1_tytul", widget: "string"}
          - {label: "Karta 1 - opis", name: "k1_opis", widget: "text"}
          - {label: "Karta 2 - tag", name: "k2_tag", widget: "string"}
          - {label: "Karta 2 - tytuł", name: "k2_tytul", widget: "string"}
          - {label: "Karta 2 - opis", name: "k2_opis", widget: "text"}
          - {label: "Karta 3 - tag", name: "k3_tag", widget: "string"}
          - {label: "Karta 3 - tytuł", name: "k3_tytul", widget: "string"}
          - {label: "Karta 3 - opis", name: "k3_opis", widget: "text"}
          - {label: "Krok 1 - tytuł", name: "krok_1", widget: "string"}
          - {label: "Krok 2 - tytuł", name: "krok_2", widget: "string"}
          - {label: "Krok 3 - tytuł", name: "krok_3", widget: "string"}
          - {label: "Krok 4 - tytuł", name: "krok_4", widget: "string"}
- file: "tresci/placowki.md"
        label: "5. Sekcja PLACÓWKI (lista i mapa)"
        name: "placowki"
        fields:
          - {label: "Etykieta sekcji", name: "etykieta", widget: "string"}
          - {label: "Tytuł sekcji", name: "tytul", widget: "string"}
          - {label: "Opis sekcji", name: "opis", widget: "text"}
          - {label: "Tytuł karty mapy", name: "mapa_tytul", widget: "string"}
          - {label: "Opis karty mapy", name: "mapa_opis", widget: "text"}
      
      - file: "tresci/badania.md"
        label: "6. Sekcja BADANIA (laboratorium)"
        name: "badania"
        fields:
          - {label: "Etykieta sekcji", name: "etykieta", widget: "string"}
          - {label: "Tytuł sekcji", name: "tytul", widget: "string"}
          - {label: "Opis sekcji", name: "opis", widget: "text"}
          - {label: "Pakiet 1 - nazwa", name: "p1_nazwa", widget: "string"}
          - {label: "Pakiet 2 - nazwa", name: "p2_nazwa", widget: "string"}
          - {label: "Pakiet 3 - nazwa", name: "p3_nazwa", widget: "string"}
          - {label: "Pakiet 4 - nazwa", name: "p4_nazwa", widget: "string"}
          - {label: "Pakiet 5 - nazwa", name: "p5_nazwa", widget: "string"}
          - {label: "Pakiet 6 - nazwa", name: "p6_nazwa", widget: "string"}
      
      - file: "tresci/specjalisci.md"
        label: "7. Sekcja SPECJALIŚCI"
        name: "specjalisci"
        fields:
          - {label: "Etykieta sekcji", name: "etykieta", widget: "string"}
          - {label: "Tytuł sekcji", name: "tytul", widget: "string"}
          - {label: "Opis sekcji", name: "opis", widget: "text"}
          - {label: "Specjalność 1", name: "s1_nazwa", widget: "string"}
          - {label: "Specjalność 2", name: "s2_nazwa", widget: "string"}
          - {label: "Specjalność 3", name: "s3_nazwa", widget: "string"}
          - {label: "Specjalność 4", name: "s4_nazwa", widget: "string"}
          - {label: "Specjalność 5", name: "s5_nazwa", widget: "string"}
          - {label: "Specjalność 6", name: "s6_nazwa", widget: "string"}
      
      - file: "tresci/sklep.md"
        label: "8. Sekcja SKLEP MEDYCZNY"
        name: "sklep"
        fields:
          - {label: "Etykieta sekcji", name: "etykieta", widget: "string"}
          - {label: "Tytuł sekcji", name: "tytul", widget: "string"}
          - {label: "Opis sekcji", name: "opis", widget: "text"}
          - {label: "Produkt 1", name: "prod_1", widget: "string"}
          - {label: "Produkt 2", name: "prod_2", widget: "string"}
          - {label: "Produkt 3", name: "prod_3", widget: "string"}
          - {label: "Produkt 4", name: "prod_4", widget: "string"}
          - {label: "Tytuł aplikacji", name: "app_tytul", widget: "string"}
          - {label: "Podtytuł aplikacji", name: "app_podtytul", widget: "string"}
      
      - file: "tresci/footer.md"
        label: "Stopka - copyright"
        name: "footer"
        fields:
          - {label: "Tekst copyright", name: "copyright", widget: "string"}

  # ========== PLACÓWKA PŁOŃSK ==========
  - name: "placowka_plonsk"
    label: "🏥 Placówka: Płońsk"
    description: "Edycja pełnej podstrony placówki w Płońsku"
    files:
      - file: "tresci/placowki/plonsk.md"
        label: "Grupa Zdrowie Płońsk - dane placówki"
        name: "placowka_plonsk"
        fields:
          - {label: "Nazwa placówki", name: "nazwa", widget: "string"}
          - {label: "Etykieta typu", name: "typ_etykieta", widget: "string"}
          - {label: "Adres", name: "adres", widget: "string"}
          - {label: "Telefon główny", name: "telefon_glowny", widget: "string"}
          - {label: "E-mail", name: "email", widget: "string"}
          - {label: "Opis krótki", name: "opis_krotki", widget: "text"}
          - {label: "Opis długi", name: "opis_dlugi", widget: "text"}
          - label: "POZ - lista"
            name: "poz_lista"
            widget: "list"
            field: {label: "Pozycja", name: "nazwa", widget: "string"}
          - label: "Poradnie specjalistyczne"
            name: "specjalistyczne_lista"
            widget: "list"
            field: {label: "Nazwa poradni", name: "nazwa", widget: "string"}
          - label: "Pracownie diagnostyczne"
            name: "pracownie_lista"
            widget: "list"
            field: {label: "Nazwa pracowni", name: "nazwa", widget: "string"}
          - label: "Usługi medyczne"
            name: "uslugi_lista"
            widget: "list"
            field: {label: "Nazwa usługi", name: "nazwa", widget: "string"}
          - {label: "🎯 Czy placówka ma opiekę koordynowaną?", name: "opieka_koordynowana", widget: "boolean", default: true}
          - {label: "Opis opieki koordynowanej", name: "opieka_opis", widget: "text", required: false}
          - label: "Zakresy opieki koordynowanej"
            name: "opieka_zakresy"
            widget: "list"
            field: {label: "Zakres", name: "nazwa", widget: "string"}
            required: false
- label: "👨‍⚕️ Lekarze"
            name: "lekarze"
            widget: "list"
            fields:
              - {label: "Imię i nazwisko", name: "nazwisko", widget: "string"}
              - {label: "Specjalizacja", name: "specjalizacja", widget: "string", required: false}
              - {label: "Poradnia", name: "poradnia", widget: "string", required: false}
          - label: "👩‍⚕️ Pielęgniarki i położne"
            name: "pielegniarki"
            widget: "list"
            fields:
              - {label: "Imię i nazwisko", name: "nazwisko", widget: "string"}
              - {label: "Specjalizacja", name: "specjalizacja", widget: "string", required: false}
          - label: "📞 Telefony / Rejestracja"
            name: "telefony"
            widget: "list"
            fields:
              - {label: "Nazwa działu", name: "dzial", widget: "string"}
              - {label: "Numer telefonu", name: "numer", widget: "string"}
          - label: "📄 Dokumenty PDF do pobrania"
            name: "dokumenty"
            widget: "list"
            fields:
              - {label: "Nazwa dokumentu", name: "nazwa", widget: "string"}
              - {label: "Plik PDF", name: "url", widget: "file", required: false}
          - label: "🏆 Certyfikaty PDF"
            name: "certyfikaty"
            widget: "list"
            fields:
              - {label: "Nazwa certyfikatu", name: "nazwa", widget: "string"}
              - {label: "Plik PDF", name: "url", widget: "file", required: false}
          - {label: "💰 Treść sekcji 'Opłaty'", name: "oplaty_tresc", widget: "text", required: false}
          - {label: "🔒 Treść klauzuli RODO", name: "rodo_tresc", widget: "text", required: false}

  # ========== OPIEKA KOORDYNOWANA ==========
  - name: "opieka_koordynowana"
    label: "🎯 Strona: Opieka Koordynowana"
    description: "Edycja strony ogólnej o opiece koordynowanej"
    files:
      - file: "tresci/opieka-koordynowana.md"
        label: "Treść strony"
        name: "opieka"
        fields:
          - {label: "Tytuł H1", name: "tytul", widget: "string"}
          - {label: "Podtytuł", name: "podtytul", widget: "text"}
          - {label: "Opis główny", name: "opis_glowny", widget: "text"}
          - {label: "Zakres 1 - tytuł", name: "zakres1_tytul", widget: "string"}
          - {label: "Zakres 1 - opis", name: "zakres1_opis", widget: "text"}
          - {label: "Zakres 2 - tytuł", name: "zakres2_tytul", widget: "string"}
          - {label: "Zakres 2 - opis", name: "zakres2_opis", widget: "text"}
          - {label: "Zakres 3 - tytuł", name: "zakres3_tytul", widget: "string"}
          - {label: "Zakres 3 - opis", name: "zakres3_opis", widget: "text"}
          - {label: "Zakres 4 - tytuł", name: "zakres4_tytul", widget: "string"}
          - {label: "Zakres 4 - opis", name: "zakres4_opis", widget: "text"}
          - {label: "Korzyść 1", name: "korzysc1", widget: "string"}
          - {label: "Korzyść 2", name: "korzysc2", widget: "string"}
          - {label: "Korzyść 3", name: "korzysc3", widget: "string"}
          - {label: "Korzyść 4", name: "korzysc4", widget: "string"}
          - {label: "Korzyść 5", name: "korzysc5", widget: "string"}
          - {label: "Korzyść 6", name: "korzysc6", widget: "string"}
