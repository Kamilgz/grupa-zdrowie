          - {label: "Aktywność - punkt 2", name: "akt_p2", widget: "string"}
          - {label: "Aktywność - punkt 3", name: "akt_p3", widget: "string"}
          - {label: "Aktywność - punkt 4", name: "akt_p4", widget: "string"}

  # ========== SEKCJA PLACÓWKI (tylko intro) ==========
  - name: "placowki"
