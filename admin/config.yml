      - file: "tresci/moduly.md"
        label: "Moduły 01, 02, 03"
        name: "moduly"
        fields:
          - {label: "Moduł 01 - tytuł", name: "modul1_tytul", widget: "string"}
          - {label: "Moduł 01 - opis", name: "modul1_opis", widget: "text"}
          - {label: "Moduł 02 - tytuł", name: "modul2_tytul", widget: "string"}
          - {label: "Moduł 02 - opis", name: "modul2_opis", widget: "text"}
          - {label: "Moduł 03 - tytuł", name: "modul3_tytul", widget: "string"}
          - {label: "Moduł 03 - opis", name: "modul3_opis", widget: "text"}

  # ========== SEKCJA KONTO PACJENTA ==========
