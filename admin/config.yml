backend:
  name: git-gateway
  repo: Kamilgz/grupa-zdrowie
  branch: main
  identity_url: https://auth.decapbridge.com/sites/7e7a16ea-6f78-474a-a3f0-0954d862a182
  gateway_url: https://gateway.decapbridge.com
  auth_type: ""
  auth_endpoint: oauth/external

site_url: https://kamilgz.github.io/grupa-zdrowie/
display_url: https://kamilgz.github.io/grupa-zdrowie/
logo_url: https://kamilgz.github.io/grupa-zdrowie/

publish_mode: simple
media_folder: "media"
public_folder: "/media"
locale: "pl"

collections:
  # ========== SEKCJA HERO (góra strony) ==========
  - name: "hero"
    label: "1. Sekcja HERO (góra strony)"
    files:
      - file: "tresci/hero.md"
        label: "Hero - tytuł i opis"
        name: "hero"
        fields:
          - {label: "Mała etykieta (Platforma medyczna)", name: "tag", widget: "string"}
          - {label: "Tytuł - linia 1 (czarna)", name: "tytul_linia_1", widget: "string"}
          - {label: "Tytuł - linia 2 (niebieska)", name: "tytul_linia_2", widget: "string"}
          - {label: "Opis pod tytułem", name: "opis", widget: "text"}
          - {label: "Tekst przycisku 1 (granatowy)", name: "przycisk_1", widget: "string"}
          - {label: "Tekst przycisku 2 (niebieski)", name: "przycisk_2", widget: "string"}
          - {label: "Obrazek pod przyciskami (pod 'Pobierz aplikację')", name: "obrazek", widget: "image", required: false, hint: "Klik 'Choose an image' aby podmienić. Zalecany rozmiar ok. 320x120px lub większy zachowując proporcje."}

  # ========== SEKCJA MODUŁY (3 kafelki) ==========
  - name: "moduly"
    label: "2. Sekcja MODUŁY (3 kafelki)"
